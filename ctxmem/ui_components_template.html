<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aegis Context Memory — UI Components Explorer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }
  .header { background: #1e293b; color: #fff; padding: 1.5rem 2rem; }
  .header h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .header p { opacity: 0.8; font-size: 0.9rem; }
  .controls { padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 0.85rem; color: #64748b; font-weight: 600; }
  .controls input { padding: 0.5rem; font-size: 0.9rem; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; flex: 1; }
  .controls button { padding: 0.5rem 1rem; font-size: 0.9rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .controls button:hover { background: #1d4ed8; }
  .stats { font-size: 0.8rem; color: #64748b; margin-left: auto; }
  .components-grid { padding: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
  .component-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1.5rem; transition: transform 0.2s, box-shadow 0.2s; }
  .component-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
  .component-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .component-name { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
  .component-type-badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; margin-left: 0.5rem; }
  .type-file { background: #dbeafe; color: #1e40af; }
  .type-class { background: #dcfce7; color: #166534; }
  .type-id { background: #fef3c7; color: #92400e; }
  .component-file { font-size: 0.8rem; color: #64748b; font-family: monospace; margin-bottom: 0.75rem; word-break: break-all; }
  .component-section { margin-bottom: 1rem; }
  .component-section h5 { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
  .property-row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid #f8fafc; font-size: 0.85rem; }
  .property-row:last-child { border-bottom: none; }
  .prop-key { color: #64748b; font-family: 'SF Mono', Monaco, monospace; }
  .prop-val { color: #1e293b; font-family: 'SF Mono', Monaco, monospace; font-weight: 600; }
  .empty-state { padding: 3rem; text-align: center; color: #64748b; }
  .preview-box { margin-top: 0.75rem; padding: 1rem; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 6px; font-size: 0.85rem; color: #475569; }
  .color-swatch { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid #cbd5e1; margin-right: 0.5rem; vertical-align: middle; }
</style>
</head>
<body>

<div class="header">
  <h1>Aegis Context Memory — UI Components Explorer</h1>
  <p>All CSS classes, components, and styling from the Aegis desktop app</p>
</div>

<div class="controls">
  <label for="filterFile">Filter by File:</label>
  <input type="text" id="filterFile" placeholder="Filter by source file (e.g., style.css, notch.css)...">
  <label for="filterClass">Filter by Class:</label>
  <input type="text" id="filterClass" placeholder="Filter by class name...">
  <button onclick="renderComponents()">Refresh</button>
  <span class="stats" id="stats"></span>
</div>

<div class="components-grid" id="componentsGrid"></div>

<script>
// EMBEDDED_CSS_DATA_PLACEHOLDER

let allCssClasses = EMBEDDED_CSS_CLASSES;

function renderComponents() {
  const grid = document.getElementById('componentsGrid');
  const filterFile = document.getElementById('filterFile').value.toLowerCase();
  const filterClass = document.getElementById('filterClass').value.toLowerCase();

  const filtered = allCssClasses.filter(n => {
    const matchFile = !filterFile || (n.file_source && n.file_source.toLowerCase().includes(filterFile));
    const matchClass = !filterClass || n.label.toLowerCase().includes(filterClass);
    return matchFile && matchClass;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">No components found matching your filters.</div>';
    return;
  }

  grid.innerHTML = filtered.map(css => renderComponentCard(css)).join('');
}

function renderComponentCard(css) {
  const props = css.properties || [];
  const fileName = css.file_source ? css.file_source.split('\\').pop().split('/').pop() : 'unknown';
  const isComponent = css.is_component ? 'type-class' : 'type-id';

  const colorProps = props.filter(p => p.toLowerCase().includes('color') || p.toLowerCase().includes('background'));
  const previewStyle = generatePreviewStyle(props);

  return `
    <div class="component-card">
      <div class="component-header">
        <div class="component-name">${escapeHtml(css.label)} <span class="component-type-badge type-${isComponent === 'type-class' ? 'class' : 'id'}">${css.is_component ? 'Component Class' : 'CSS ID'}</span></div>
      </div>
      <div class="component-file">${escapeHtml(fileName)}</div>

      <div class="component-section">
        <h5>Properties (${props.length})</h5>
        ${props.map(p => {
          const [key, ...valParts] = p.split(':');
          const val = valParts.join(':').trim();
          return `<div class="property-row"><span class="prop-key">${escapeHtml(key.trim())}</span>: <span class="prop-val">${escapeHtml(val.trim())}</span></div>`;
        }).join('')}
      </div>

      <div class="component-section">
        <h5>Visual Preview</h5>
        <div class="preview-box" style="${previewStyle}">${css.label}</div>
      </div>

      ${colorProps.length > 0 ? `
      <div class="component-section">
        <h5>Colors Used</h5>
        ${colorProps.map(p => {
          const val = p.split(':').slice(1).join(':').trim();
          const colorMatch = val.match(/#([0-9a-fA-F]{3,6})|rgba?\(([^)]+)\)/);
          const color = colorMatch ? colorMatch[0] : val;
          return `<div style="display:flex;align-items:center;margin:0.2rem 0;"><div class="color-swatch" style="background:${escapeHtml(color)}"></div>${escapeHtml(val)}</div>`;
        }).join('')}
      </div>` : ''}
    </div>
  `;
}

function generatePreviewStyle(props) {
  let style = '';
  props.forEach(p => {
    const [key, ...valParts] = p.split(':');
    const val = valParts.join(':').trim();
    const k = key.trim().toLowerCase();
    if (k === 'background' || k === 'background-color') style += `background-color: ${val}; `;
    if (k === 'color') style += `color: ${val}; `;
    if (k === 'padding') style += `padding: ${val}; `;
    if (k === 'margin') style += `margin: ${val}; `;
    if (k === 'border-radius') style += `border-radius: ${val}; `;
    if (k === 'font-size') style += `font-size: ${val}; `;
    if (k === 'font-weight') style += `font-weight: ${val}; `;
    if (k === 'border') style += `border: ${val}; `;
  });
  return style;
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

renderComponents();
document.getElementById('filterFile').addEventListener('input', renderComponents);
document.getElementById('filterClass').addEventListener('input', renderComponents);
</script>
</body>
</html>
