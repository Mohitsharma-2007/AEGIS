  });
  on('state', s => { if (['done', 'error', 'notification'].includes(s.state)) flash(); if (['working', 'thinking', 'searching'].includes(s.state) && !note && !open && !view && !typing()) openView((A.W.agents || []).some(a => !['idle', 'done'].includes(a.state)) ? 'subagents' : 'live', '', 16000); });
  const meta = () => { const d = A.WX.data, m = A.W.media; $('#meta').innerHTML = focus.end ? `<b style="color:var(--violet)">◔ ${mmss(fLeft())}</b>` : (m && m.playing ? '<span class="bars" style="display:inline-flex;height:11px"><i></i><i></i><i></i></span> ' : d ? A.wxIcon(d.kind, d.night, 15) + A.deg(d.temp) + ' · ' : '') + A.hm(new Date()); };
  on('weather', meta); on('tick', meta); on('data', meta);

  const typing = () => document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);

  // ---- use-case routing: /call <widget> resolves a real widget, never a static board ----
  const CALL = { weather: 'weather', forecast: 'weather', temperature: 'weather', tasks: 'tasks', todo: 'tasks', 'to-do': 'tasks', focus: 'focus', timer: 'timer', timers: 'timer', meeting: 'meeting', meetings: 'schedule', calendar: 'schedule', schedule: 'schedule', events: 'schedule', agenda: 'schedule', files: 'files', 'file-tray': 'files', notes: 'notepad', notepad: 'notepad', tool: 'harness', tools: 'harness', harness: 'harness', task: 'agentrun', job: 'agentrun', notifications: 'notes', activity: 'notes', system: 'system', cpu: 'system', gpu: 'system', ram: 'system', agents: 'agents', subagents: 'agents', ask: 'ask', live: 'live', media: 'media', music: 'media', nowplaying: 'media', market: 'market', stocks: 'market', bitcoin: 'market', devices: 'devices', bluetooth: 'devices', health: 'health', security: 'security', model: 'model', clipboard: 'clipboard', coding: 'coding', navigation: 'navigation', tracking: 'tracking', payment: 'payment', spending: 'payment', call: 'call', research: 'research' };
  function callWidget(raw, q) {
    const key = String(raw || '').trim().toLowerCase().replace(/^\/call\s+/, '').replace(/[^a-z0-9-]+/g, ' ').trim().split(' ')[0];
    const target = CALL[key] || (Cards.DEF[key] ? key : null);
    if (!target) {
      // Any of the 300+ library widgets can be called by name; it opens as a tile.
      const ids = Lib.match(raw, 1);
      if (ids.length) { openView('x', ids); return true; }
      A.notify({ kind: 'info', title: 'Unknown widget', body: 'Try /call weather, /call meeting, /call tasks, /call timer, /call system, /call agents or a library name like /call bitcoin.' });
      return false;
    }
    if (target === 'tasks' || target === 'focus' || target === 'files' || target === 'schedule') { openWs('work'); if (target === 'schedule') openView('schedule', '', 20000); else requestAnimationFrame(() => { const sel = target === 'tasks' ? '#tnew' : target === 'focus' ? '#fgo' : '#file-list'; document.querySelector(sel)?.scrollIntoView({ block: 'nearest' }); }); return true; }
    if (target === 'agents') { openWs('agents'); return true; }
    openView(target, q || '', 20000); return true;
  }
  const submitCall = () => {
    const input = $('#callin'); if (!input) return;
    const text = input.value.trim(); if (!text) return;
    input.value = '';
    const callMatch = text.match(/^\/call\s+(.+)$/i);
    if (callMatch) { callWidget(callMatch[1]); return; }
    if (/^\/ask\b/i.test(text)) { const q = text.replace(/^\/ask\s*/i, '').trim(); if (q) { A.update({ text: 'You: ' + q, keepState: true }); openView('ask'); A.act('ask', 'send', q); } return; }
    if (/^\/widgets?\b/i.test(text)) { openWs('live'); return; }
    A.update({ text: 'You: ' + text, keepState: true }); A.act('ask', 'send', text); openView('ask');
  };
  $('#callgo')?.addEventListener('click', e => { e.stopPropagation(); submitCall(); });
  $('#callin')?.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); submitCall(); } else if (e.key === 'Escape') e.target.blur(); });
  // The notch is meeting-aware: a real meeting exposes Join, otherwise All meetings / Schedule.
  const drawMeetingBar = () => {
    const el = $('#mbar'); if (!el) return;
    const m = A.W.meeting, sc = A.W.schedule, items = (sc && sc.items) || [];
    if (!m && !items.length) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    const start = m && /^\d{4}-\d\d-\d\dT/.test(m.start || '') ? A.hm(new Date(m.start)) : ((m && m.start) || '');
    el.innerHTML = m
      ? `<b>${esc(m.title || 'Meeting')}</b><span>${esc(start)}${m.people ? ' · ' + esc(m.people) : ''}</span><span class="sp"></span><button data-mjoin="1">Join</button><button class="alt" data-mall="1">All meetings</button>`
      : `<b>No meeting now</b><span>${items.length} event${items.length === 1 ? '' : 's'} today</span><span class="sp"></span><button class="alt" data-mall="1">All meetings</button><button data-msched="1">Schedule</button>`;
  };
  $('#mbar')?.addEventListener('click', e => {
    e.stopPropagation();
    if (e.target.closest('[data-mjoin]')) A.act('meeting', 'join');
    else if (e.target.closest('[data-mall]')) openView('schedule', '', 20000);
    else if (e.target.closest('[data-msched]')) { A.act('schedule', 'open'); api?.show?.(); }
  });
  const deck2Hint = () => {
    const shown = [...deck2.querySelectorAll('.w')].filter(s => s.style.display !== 'none').length;
    let hint = deck2.querySelector('.deck-empty');
    if (shown) { hint?.remove(); return; }
    if (!hint) { hint = document.createElement('div'); hint.className = 'deck-empty'; deck2.appendChild(hint); }
    hint.innerHTML = tab === 'live'
      ? '<b>Nothing live right now</b>Widgets appear here by themselves when there is real data — weather, media, market, system, tracking.'
      : '<b>No agents running</b>Subagents, research and model activity appear here when work starts.';
  };
  deck2.addEventListener('cards', deck2Hint);

  // One pointer authority: the renderer hit-tests the real island rect. A small
  // hysteresis gap means an edge wobble cannot flip hover on and off.
  const islandRect = () => island.getBoundingClientRect();
  const hitTest = (x, y) => {
    if (typing()) return true;
    const r = islandRect();
    const pad = hover ? 14 : 6;
    const left = r.left - pad, right = r.right + pad, bottom = r.bottom + pad;
    return x >= left && x <= right && y >= 0 && y <= bottom;
  };

  // Only cross the Electron boundary when the mode actually changes. The native
  // window is always interactive (sized to the island), so there is no
  // click-through to manage — we just report hit state for diagnostics.
  let routingInteractive = false;
  const updateRouting = interactive => {
    if (routingInteractive === interactive) return;
    routingInteractive = interactive;
    api?.action?.('notch-hit', { inside: interactive });
  };

  const clearClose = () => { clearTimeout(closeT); closeT = null; };

  const setHov = h => {
    if (h) {
      clearClose();
      updateRouting(true);
      if (!hover) {
        hover = true;
        suppressHoverOpen = false;
        island.classList.add('hover');
        size();
      }
      // Hover opens the shelf after a short dwell, exactly like NotchNook:
      // glance at the island and it expands. Clicking still toggles instantly.
      if (!open && !note && !view && !suppressHoverOpen && !dwellT) {
        dwellT = setTimeout(() => {
          dwellT = null;
          if (!st.listening && !open && hover) openWs();
        }, Math.max(120, Number(notchCfg.hoverDelay) || 240));
      }
    } else {
      clearTimeout(dwellT);
      dwellT = null;
      if ((hover || open) && !closeT) {
        closeT = setTimeout(() => {
          closeT = null;
          if (typing()) return;
          if (open) closeWs();
          hover = false;
          suppressHoverOpen = false;
          island.classList.remove('hover');
          updateRouting(false);
          armView(4000);
          armNote();
          drawQuick();
          size();
        }, Math.max(0, Number(notchCfg.closeDelay) || 0) + (open ? 60 : 0));
      }
    }
  };

  // Register after setHov exists, then let the main process replay the current
  // pointer state. This avoids losing the initial hover event during load.
  api?.onEvent?.((name, data) => {
    if (name === 'call-widget') callWidget(data && data.name);
    else if (name === 'view:widgets') openWs('live');
    else if (name === 'view:close') closeWs();
    else if (name === 'notch:pointer-enter' || name === 'notch:pointer-leave') { /* renderer owns hover */ }
  });
  api?.action?.('notch-renderer-ready');

  let pointerFrame = 0, pointerX = 0, pointerY = 0;
  document.addEventListener('mousemove', e => {
    pointerX = e.clientX; pointerY = e.clientY;
    if (pointerFrame) return;
    pointerFrame = requestAnimationFrame(() => {
      pointerFrame = 0;
      setHov(hitTest(pointerX, pointerY));
    });
  }, { capture: true, passive: true });

  document.addEventListener('mouseleave', () => setHov(false));
  document.addEventListener('mouseout', e => { if (!e.relatedTarget) setHov(false); });
  addEventListener('blur', () => { if (!typing()) setHov(false); });

  island.addEventListener('mouseenter', () => setHov(true));
  island.addEventListener('mouseleave', e => {
    if (!hitTest(e.clientX, e.clientY)) setHov(false);
  });

  // Clicking the notch toggles its expansion immediately
  $('#compact').addEventListener('click', e => {
    clearTimeout(dwellT);
    dwellT = null;
    if (e.target.closest('#voice')) { if (st.listening) A.toggleVoice(); return; }
    if (e.target.closest('#stack')) return;
    if (note && note.kind === 'ask') return;
    if (view) { closeView(); return; }
    if (open) {
      // Clicking the shelf closes it. It must not stay pinned after the
      // pointer leaves: the workspace is transient and dismisses on exit.
      suppressHoverOpen = true;
      closeWs();
    } else {
      suppressHoverOpen = false;
      openWs();
    }
  });
  // subagent faces are buttons: click one to open the tree with that subagent expanded
  stack.addEventListener('click', e => { e.stopPropagation(); clearTimeout(dwellT); const f = e.target.closest('[data-ag]'); if (note && note.kind === 'ask') return; if (view === 'subagents' && !f) return closeView(); Cards.selectAgent(f ? f.dataset.ag : null); openView('subagents', '', 20000); });
  $('#talk').addEventListener('click', () => { closeWs(); A.toggleVoice(); });                    // click the notch → listen
  // Electron exposes the original file paths on dropped File objects. Copy is
  // performed by the main process into the owner's workspace, accepting all
  // regular file types while bounding count and aggregate size there.
  let dropDepth = 0;
  island.addEventListener('dragenter', e => { e.preventDefault(); dropDepth++; island.classList.add('drop-target'); });
  island.addEventListener('dragover', e => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; });
  island.addEventListener('dragleave', e => { e.preventDefault(); dropDepth = Math.max(0, dropDepth - 1); if (!dropDepth) island.classList.remove('drop-target'); });
  island.addEventListener('drop', async e => {
    e.preventDefault(); e.stopPropagation(); dropDepth = 0; island.classList.remove('drop-target');
    const files = Array.from(e.dataTransfer?.files || []);
    if (!files.length) { A.update({ text: 'No files were included in this drop.', keepState: true }); flash(); return; }
    try {
      const result = await api?.importDroppedFiles?.(files);
      const count = result?.files?.length || 0;
      const rejected = result?.rejected?.length || 0;
      if (count) { fileTray = [...result.files, ...fileTray].slice(0, 100); saveFileTray(); }
      A.update({ text: count ? `Added ${count} file${count === 1 ? '' : 's'} to the Aegis file tray${rejected ? ` · ${rejected} skipped` : ''}.` : (result?.error || 'No files were added.'), keepState: true });
      if (count) { openWs('work'); }
    } catch (error) { A.update({ text: error?.message || 'Could not add dropped files.', keepState: true }); }
    flash();
  });
  quick.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.v) view === b.dataset.v ? closeView() : openView(b.dataset.v, '', 20000); else if (b.dataset.c === 'close') closeView(); else if (b.dataset.c === 'open') api?.show?.(); else if (b.dataset.c === 'widgets') openWs('widgets'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeView(); closeWs(); if (note && note.kind !== 'ask') hideNote(); } });
  if (A.PREVIEW) addEventListener('DOMContentLoaded', () => { const d = document.createElement('div'); d.id = 'say'; d.innerHTML = ["What's the time?", "What's the date?", 'Play the song', "What's my flight?", 'GPU usage?', 'Which devices are connected?', 'Stock price?', "How's the weather?", 'Show my subagents', 'Bitcoin price', 'Time in Tokyo', 'Disk space', 'Add task call the bank', 'Start focus', 'Open Aegis', 'Show me the widgets'].map(t => `<button>${t}</button>`).join(''); document.body.appendChild(d); d.addEventListener('click', e => { if (e.target.tagName === 'BUTTON') { A.update({ text: 'You: ' + e.target.textContent, keepState: true }); A.hear(e.target.textContent); } }); });
  // ---- Notch settings panel: live, persisted through the desktop shell ----
  const NS_RANGES = [
    ['ns-offset', 'offsetX', v => String(Math.round(v))],
    ['ns-cw', 'compactWidth', v => Math.round(v) + 'px'],
    ['ns-ew', 'expandedWidth', v => Math.round(v) + 'px'],
    ['ns-eh', 'expandedHeight', v => Math.round(v) + 'px'],
    ['ns-scale', 'scale', v => Math.round(v * 100) + '%'],
    ['ns-radius', 'radius', v => Math.round(v) + 'px'],
    ['ns-gap', 'topGap', v => Math.round(v) + 'px'],
    ['ns-border', 'border', v => Math.round(v * 100) + '%'],
    ['ns-shadow', 'shadow', v => Math.round(v * 100) + '%'],
    ['ns-hover', 'hoverDelay', v => Math.round(v) + 'ms'],
    ['ns-close', 'closeDelay', v => Math.round(v) + 'ms'],
  ];
  function syncNotchForm() {
    const placement = document.getElementById('ns-place');
    if (placement) placement.value = notchCfg.placement;
    const blurToggle = document.getElementById('ns-blur');
    if (blurToggle) {
      blurToggle.checked = notchCfg.blur === true;
      const output = blurToggle.parentElement?.querySelector('output');
      if (output) output.textContent = notchCfg.blur ? 'On' : 'Off';
    }
    for (const [id, key] of NS_RANGES) {
      const input = document.getElementById(id);
      if (!input) continue;
      input.value = String(notchCfg[key]);
      const output = input.parentElement?.querySelector('output');
      if (output) output.textContent = NS_RANGES.find(r => r[0] === id)[2](notchCfg[key]);
    }
  }
  let saveTimer = null;
  const persistNotchCfg = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { api?.setNotchSettings?.(notchCfg)?.catch?.(() => {}); }, 150);
  };
  function initNotchSettings() {
    for (const [id, key, format] of NS_RANGES) {
      const input = document.getElementById(id);
      if (!input) continue;
      input.addEventListener('input', () => {
        notchCfg = { ...notchCfg, [key]: Number(input.value) };
        const output = input.parentElement?.querySelector('output');
        if (output) output.textContent = format(Number(input.value));
        applyNotchCfg(notchCfg);
        persistNotchCfg();
      });
    }
    const placement = document.getElementById('ns-place');
    placement?.addEventListener('change', () => {
      notchCfg = { ...notchCfg, placement: placement.value };
      applyNotchCfg(notchCfg);
      persistNotchCfg();
    });
    document.getElementById('ns-blur')?.addEventListener('change', event => {
      notchCfg = { ...notchCfg, blur: event.target.checked };
      applyNotchCfg(notchCfg);
      persistNotchCfg();
    });
    document.getElementById('ns-reset')?.addEventListener('click', () => {
      notchCfg = { ...NOTCH_DEFAULTS };
      applyNotchCfg(notchCfg);
      persistNotchCfg();
    });
    const panel = document.getElementById('nset');
    const toggle = on2 => {
      const next = on2 ?? !island.classList.contains('nset');
      island.classList.toggle('nset', next);
      if (next) { suppressHoverOpen = true; open = true; api?.action?.('notch-expanded', { expanded: true }); island.classList.add('open'); size(); }
      else { suppressHoverOpen = false; open = false; api?.action?.('notch-expanded', { expanded: false }); island.classList.remove('open'); size(); }
    };
    settingsToggle = toggle;
    island.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); toggle(true); });
    document.getElementById('ns-done')?.addEventListener('click', () => toggle(false));
    panel?.addEventListener('click', e => e.stopPropagation());
    panel?.addEventListener('pointerdown', e => e.stopPropagation());
    void api?.getNotchSettings?.().then(cfg => { if (cfg) applyNotchCfg(cfg); }).catch(() => {});
    api?.onNotchSettings?.(cfg => applyNotchCfg(cfg));
  }
  initNotchSettings();
  applyNotchCfg(notchCfg);

  drawQuick(); A.start(); drawFocus(); meta(); size();
})();
    </script>
