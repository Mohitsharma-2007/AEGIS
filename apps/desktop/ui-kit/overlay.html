    <title>Aegis overlay</title>
    <style>
:root{color-scheme:dark;--surface:#09090B;--card:#111114;--card2:#1C1C21;--card3:#26262C;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.15);--text:#F6F3EF;--dim:#A8A49E;--faint:#6F6C68;--accent:#E8714F;--accent2:#F08A68;--accent-soft:rgba(232,113,79,.16);--shadow:rgba(0,0,0,.5);--state:#5FD3A0;--green:#4ADE80;--blue:#5B9BF5;--violet:#A78BFA;--amber:#F5B544;--red:#F2555A;--pink:#F472B6;--cyan:#38D0E8;--spring:cubic-bezier(.34,1.4,.36,1);--ease:cubic-bezier(.22,.9,.28,1)}
:root[data-theme=light]{color-scheme:light;--surface:#F7F4F0;--card:#FFFFFF;--card2:#F1ECE6;--card3:#E6DFD7;--line:rgba(31,34,36,.09);--line2:rgba(31,34,36,.18);--text:#1B1C1E;--dim:#625D57;--faint:#958E87;--accent:#C9583A;--accent2:#C9583A;--accent-soft:rgba(201,88,58,.12);--shadow:rgba(31,34,36,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;font-size:12px}
button{font:inherit;color:inherit}input{font:inherit}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.mm{display:block;line-height:0}.mm svg{display:block;overflow:visible}
.dot{width:6px;height:6px;border-radius:50%;background:var(--state);box-shadow:0 0 8px var(--state);flex:0 0 auto;transition:background .3s,box-shadow .3s}
.bars{display:flex;align-items:center;gap:2px;height:18px}.bars i{width:2.5px;height:100%;border-radius:99px;background:var(--c,var(--state));transform:scaleY(.2);opacity:.9}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
/* ── widget cards ── */
.w{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--card2) 34%,var(--card)),var(--card));border:1px solid var(--line);border-radius:20px;padding:13px 15px;overflow:hidden;min-width:0;break-inside:avoid;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);animation:win .45s var(--spring) both;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.w:hover,.w:focus-within{transform:translateY(-1px);border-color:var(--line2);box-shadow:0 10px 26px var(--shadow)}
@keyframes win{from{opacity:0;transform:translateY(8px) scale(.97)}}
.w header{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-height:22px}
.w header>svg.i{color:var(--dim);width:24px;height:24px;padding:5px;border-radius:8px;background:var(--card2);box-sizing:border-box}
.w header b{font-size:12.5px;font-weight:650;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w header .r{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);white-space:nowrap}
.badge{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:99px;font-size:10px;font-weight:650;color:var(--c,var(--green));background:color-mix(in srgb,var(--c,var(--green)) 16%,transparent);white-space:nowrap}
.big{font-size:27px;font-weight:650;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}.big small{font-size:12px;font-weight:500;color:var(--dim);margin-left:3px;letter-spacing:0}
.t{font-size:12.5px;line-height:1.4}.s{font-size:10.5px;color:var(--dim);line-height:1.35}.f{font-size:10px;color:var(--faint)}
.el{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;min-width:0}.sp{margin-left:auto}.col{display:grid;gap:2px;min-width:0}.grow{flex:1;min-width:0}
.pbar{height:5px;border-radius:99px;background:var(--card3);overflow:hidden;margin:7px 0 6px}.pbar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--state));transition:width .5s var(--ease)}
.pbar.run i{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);background-size:60px 100%;background-repeat:no-repeat;background-color:var(--c,var(--state));animation:shine 1.3s linear infinite}
@keyframes shine{from{background-position:-60px 0}to{background-position:320px 0}}
.btn{height:28px;padding:0 11px;border-radius:99px;border:0;background:var(--card2);color:var(--text);font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:background .15s,transform .15s,filter .15s;-webkit-app-region:no-drag;white-space:nowrap}
.btn:hover{background:var(--card3)}.btn:active{transform:scale(.95)}.btn.p{background:var(--accent);color:#fff}.btn.p:hover{filter:brightness(1.1);background:var(--accent)}.btn.ic{width:28px;padding:0}.btn.lg{height:36px;width:36px}.btn svg.i{width:13px;height:13px}
.btn.wide{flex:1}.link{background:none;border:0;padding:0;color:var(--accent2);font-size:11px;cursor:pointer}.link:hover{text-decoration:underline}
.steps{display:grid;gap:5px;margin:8px 0 2px}.steps div{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim)}
.steps i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--card3);flex:0 0 auto;display:grid;place-items:center;font-style:normal;font-size:9px;color:var(--faint)}
.steps .done{color:var(--text)}.steps .done i{background:var(--green);border-color:var(--green);color:#06210f}.steps .now{color:var(--text)}.steps .now i{border-color:var(--state);border-top-color:transparent;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tog{width:34px;height:20px;border-radius:99px;border:0;background:var(--card3);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}.tog::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}.tog.on{background:var(--green)}.tog.on::after{transform:translateX(14px)}
.av{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:0 0 auto;overflow:hidden;font-size:11px;font-weight:700}
.av.bob svg{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2px)}}
.art{width:58px;height:58px;border-radius:14px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),#7A2E6B 70%,#2B2F77);background-size:cover;background-position:center;display:grid;place-items:center;color:#fff}
.seek{height:4px;border-radius:99px;background:var(--card3);flex:1;overflow:hidden}.seek i{display:block;height:100%;background:var(--text);border-radius:99px}
.vol{flex:1;height:22px;border-radius:99px;background:var(--card2);position:relative;overflow:hidden;cursor:pointer}.vol i{position:absolute;inset:0 auto 0 0;background:var(--text);opacity:.85;border-radius:99px;min-width:22px}.vol span{position:absolute;left:9px;top:4px;font-size:10px;font-weight:700;color:var(--card);mix-blend-mode:normal;z-index:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:10px;font-variant-numeric:tabular-nums}.cal b{color:var(--blue);font-weight:650;padding-bottom:2px}.cal span{height:19px;line-height:19px;border-radius:50%}.cal .o{color:var(--faint)}.cal .td{background:var(--blue);color:#fff;font-weight:700}
.ev{display:flex;gap:8px;align-items:stretch;padding:6px 8px;border-radius:11px;background:var(--card2)}.ev::before{content:"";width:3px;border-radius:9px;background:var(--c,var(--blue))}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}.mini div{background:var(--card2);border-radius:11px;padding:6px 7px}.mini small{display:block;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}.mini b{font-size:12.5px;font-weight:650}
.hb{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:6px}.hb i{flex:1;border-radius:5px;background:var(--c,var(--blue));min-height:4px;transition:height .4s var(--ease)}
.ask{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 12px;border-radius:13px;background:var(--card2);border:1px solid transparent;transition:border-color .2s}.ask:focus-within{border-color:var(--accent)}
.ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:12.5px;user-select:text;-webkit-user-select:text}.ask input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips .btn{height:25px;font-size:10.5px;font-weight:500;color:var(--dim)}.chips .btn b{color:var(--accent2);font-weight:650;margin-right:2px}
.orb{width:44px;height:44px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 50% 50%,transparent 46%,var(--state) 50%,transparent 64%);filter:drop-shadow(0 0 9px var(--state));transform:scale(var(--pulse,1))}
.trk{position:relative;height:16px;margin:9px 0 7px}.trk::before{content:"";position:absolute;left:0;right:0;top:5px;height:6px;border-radius:99px;background:var(--card3)}.trk i{position:absolute;left:0;top:5px;height:6px;border-radius:99px;background:var(--c,var(--violet))}.trk em{position:absolute;top:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--card3);border:3px solid var(--card)}.trk em.on{background:var(--c,var(--violet))}
.wxi{overflow:visible;flex:0 0 auto}.wxi .spin{animation:wxspin 14s linear infinite}.wxi .drop{animation:wxdrop 1.1s linear infinite}.wxi .drop:nth-of-type(2){animation-delay:.35s}.wxi .drop:nth-of-type(3){animation-delay:.7s}.wxi .bolt{animation:wxbolt 2.4s ease-in-out infinite}.wxi .drift{animation:wxdrift 5s ease-in-out infinite}
@keyframes wxspin{to{transform:rotate(360deg)}}@keyframes wxdrop{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(4px);opacity:0}}@keyframes wxbolt{0%,70%,100%{opacity:.35}76%,84%{opacity:1}80%{opacity:.4}}@keyframes wxdrift{0%,100%{transform:translateX(-.8px)}50%{transform:translateX(.8px)}}
.wxin{display:flex;gap:6px;margin-top:6px}.wxin input{flex:1;min-width:0;height:28px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--text);padding:0 9px;outline:0;font-size:11.5px;user-select:text;-webkit-user-select:text}
/* notification card (shared by notch / overlay / tray pill) */
.note{display:flex;gap:10px;align-items:flex-start}.note .ni{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);color:var(--c,var(--accent))}
/* preview only (never active inside the app) */
html.preview body{background:radial-gradient(900px 600px at 15% 0%,#3b2620,transparent 60%),radial-gradient(900px 700px at 95% 100%,#1f2340,transparent 60%),#141416;overflow:auto}
#pv{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:5px;border-radius:14px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.14);z-index:99;max-width:96vw}
#pv button{border:0;border-radius:9px;background:rgba(255,255,255,.1);color:#fff;font-size:10.5px;padding:4px 8px;cursor:pointer}#pv button:hover{background:#E8714F}#pv span{font-size:10px;color:#bbb;align-self:center;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media(max-width:560px){.w{padding:11px 12px;border-radius:18px}.xgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:7px}}

.lv{--text:#F6F3EF;--dim:#A8A49E;--faint:#8A8680;--line:rgba(255,255,255,.1);color:#F6F3EF;display:flex;align-items:center;gap:9px;padding:8px 12px 8px 8px;border-radius:22px;background:#000;border:1px solid var(--line);cursor:pointer}.w-live{background:transparent!important;border-color:transparent!important;padding:0!important;box-shadow:none!important}
.lvi{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);font-size:14px}.lvi svg{width:15px;height:15px}
.lvv{font-size:15px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}.lvr{gap:7px;font-size:10px;color:var(--dim);font-weight:650}.lvr .trk{margin:0}.lvr .trk i{background:var(--c)}.lv .pbar{background:rgba(255,255,255,.16)}.lv .trk::before{background:rgba(255,255,255,.16)}.lv .pbar{height:4px;margin:4px 0 1px}

/* subagent tree */
.sa-lead{display:flex;align-items:center;gap:9px}.sa-tree{position:relative;margin:6px 0 0 14px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.sa-tree::before{content:"";position:absolute;left:0;top:-4px;bottom:19px;width:1.5px;background:var(--line2);border-radius:2px}
.sa{position:relative;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:13px;background:var(--card2);cursor:pointer;animation:sain .45s var(--spring) both}.sa::before{content:"";position:absolute;left:-18px;top:50%;width:14px;height:1.5px;background:var(--line2)}
.sa.dn{opacity:.6}.sa .pbar{height:3px;margin:4px 0 0}@keyframes sain{from{opacity:0;transform:translateX(-10px) scale(.94)}}
/* library tiles */
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.x{position:relative;min-width:0;min-height:86px;padding:10px 11px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.x:hover,.x:focus-within{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 8px 24px #0003}
.x.wide{grid-column:span 2}.xh{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);font-weight:600;min-width:0}.xg{flex:0 0 auto;font-size:12px;line-height:1;width:14px;text-align:center}.xt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.xv{font-size:21px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}.xv.sm{font-size:15px}.xv.xsm{font-size:12px;white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.xv small{font-size:10.5px;font-weight:600;color:var(--dim);margin-left:3px}.xv.dim,.dim{color:var(--faint)}
.xsub{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xrow{display:flex;align-items:center;gap:9px;margin-top:auto}.xr{width:34px;height:34px;flex:0 0 auto}.xrow .xv{margin:0;font-size:17px}
.xb{height:5px;border-radius:3px;background:var(--card3);overflow:hidden;margin-top:5px}.xb i{display:block;height:100%;border-radius:3px;transition:width .5s var(--ease)}.xs{width:100%;height:22px;margin-top:3px}
.xl{display:flex;flex-direction:column;gap:3px;margin-top:3px;font-size:11px}.xl div{display:flex;gap:8px}.xl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xl b{font-weight:600;color:var(--dim);white-space:nowrap}
.xtog{margin-top:auto;width:38px;height:22px;border-radius:11px;border:0;background:var(--card3);position:relative;cursor:pointer;padding:0;transition:background .2s}.xtog i{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}.xtog.on{background:var(--green)}.xtog.on i{transform:translateX(16px)}
.xtool{margin-top:auto;border:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer}.xtool:active{transform:scale(.96)}
.xx{width:16px;height:16px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0;flex:0 0 auto}

.sa.sel{background:var(--card3);box-shadow:inset 0 0 0 1px var(--line2)}.sa-d{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}.sa-d .steps{margin:5px 0 0}.sa-log{margin-top:5px;font:10.5px/1.45 ui-monospace,Consolas,monospace;color:var(--dim)}.sa-log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn.mini{height:24px;padding:0 10px;font-size:10.5px;border-radius:8px}

.stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;pointer-events:none}
.stage>*{pointer-events:auto}
html.preview .stage{width:280px;height:340px;margin:30px auto 0;outline:1px dashed rgba(255,255,255,.16)}
/* the character never changes size on hover */
.mascot-wrap{position:relative;width:var(--sz,100px);height:var(--sz,100px);display:grid;place-items:center;cursor:grab;-webkit-app-region:no-drag;touch-action:none;flex:0 0 auto}
.mascot-wrap:active{cursor:grabbing}
.aura{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 50% 58%,color-mix(in srgb,var(--state) 50%,transparent),transparent 68%);filter:blur(12px);opacity:0;transform:scale(var(--pulse,1));transition:background .5s,opacity .4s;pointer-events:none}
:root:not([data-state=idle]) .aura{opacity:.55}
.ring{position:absolute;inset:2%;border-radius:50%;border:2px solid var(--state);opacity:0;pointer-events:none}
:root[data-state=listening] .ring{animation:ripple 1.6s ease-out infinite}:root[data-state=listening] .ring.b{animation-delay:.8s}
@keyframes ripple{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.22);opacity:0}}
.orbit{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s}
.orbit::after,.orbit::before{content:"";position:absolute;left:50%;top:1%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--state);box-shadow:0 0 10px var(--state)}
.orbit::before{top:auto;bottom:1%;width:4px;height:4px;margin-left:-2px;opacity:.7}
.busy .orbit{opacity:1;animation:orbit 1.3s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}
.spark{position:absolute;left:50%;top:40%;width:6px;height:6px;border-radius:50%;background:var(--c);pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
#mascot-img{position:relative;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.pill{transition:opacity .25s ease,transform .35s var(--spring),border-color .3s}.pill.quiet{opacity:0;transform:translateY(-8px) scale(.9);pointer-events:none}

/* everything informative lives BELOW the character */
.below{display:flex;flex-direction:column;align-items:center;gap:clamp(3px,1.1vh,7px);width:min(264px,calc(100% - 8px));margin-top:clamp(-2px,.4vh,3px);max-height:calc(100% - 120px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.below::-webkit-scrollbar{display:none}

.pill{max-width:100%;padding:5px 11px;border-radius:15px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 6px 16px var(--shadow);transition:border-color .3s;cursor:default}
.pill .rowp{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:650;white-space:nowrap;justify-content:center}
.pill .rowp b{color:var(--state)}.pill .rowp span.m{color:var(--dim);font-weight:500}
.pill p{margin:3px 0 1px;font-size:11.5px;line-height:1.36;color:var(--text);text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.pill p:empty{display:none}
.pill{flex:0 0 auto}
@media(max-height:430px){.stage{padding-top:4px}.below{gap:3px}.pill{padding:4px 9px}.pill p{-webkit-line-clamp:2}}
.pill .pbar{margin:5px 0 2px;height:4px}.pill .bars{height:12px}.pill .bars i{width:2px}
:root:not([data-state=speaking]):not([data-state=listening]) .pill .bars{display:none}
.toast{width:100%;padding:9px 11px;border-radius:17px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 8px 20px var(--shadow);animation:tin .5s var(--spring) both;cursor:pointer}
.toast.out{animation:tout .3s ease forwards}@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.9)}}@keyframes tout{to{opacity:0;transform:translateY(6px) scale(.95)}}
.toast .steps{margin:5px 0 0;gap:3px}.toast .steps div{font-size:10.5px}.toast .steps i{width:13px;height:13px;font-size:8px}

.minis{width:70px;display:flex;flex-wrap:wrap-reverse;gap:4px;align-content:flex-start;padding-bottom:6px;min-height:34px}.minis.l{justify-content:flex-end}.minis.r{justify-content:flex-start}

function fromOutline(pts) {            // closed polygon -> N radii measured from (0, CY), starting at 12 o'clock

<script>
/* Pointer routing for a transparent, click-through surface window: stay
   click-through over empty space, become interactive over real controls.
   Without this the notch/widgets buttons and the mascot were unclickable. */
(() => {
  let interactive = false;
  const sample = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const isControl = !!el && el !== document.body && el !== document.documentElement;
    if (isControl !== interactive) {
      interactive = isControl;
      (window.aegis && window.aegis.setClickThrough)
        ? window.aegis.setClickThrough(!isControl)
        : undefined;
    }
  };
  document.addEventListener('mousemove', (e) => sample(e.clientX, e.clientY), true);
  document.addEventListener('mouseleave', () => {
    if (interactive) {
      interactive = false;
      if (window.aegis && window.aegis.setClickThrough) window.aegis.setClickThrough(true);
    }
  });
})();
