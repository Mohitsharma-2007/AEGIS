<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegi & crew — mascot & sound playground</title>
<style>
#pg{--bg:#F4EEE7;--panel:#FFFDFA;--ink:#1F2224;--mute:#6E6660;--line:#E4DAD0;--brand:#BA5B45}
#pg.dk{--bg:#0E1012;--panel:#17191C;--ink:#F4EEE7;--mute:#9AA0A6;--line:#2A2E32}
html,body{margin:0}#pg *{box-sizing:border-box}#pg{min-height:100vh;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);transition:background .25s,color .25s}
#pg .wrap{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px}
@media(max-width:820px){#pg .wrap{grid-template-columns:1fr}}
#pg h1{font-size:20px;margin:0 0 2px}#pg h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}#pg h2:first-child{margin-top:0}
#pg .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
#pg .stage{position:sticky;top:20px;text-align:center}
#pg #mascot{height:300px;display:grid;place-items:center}
#pg #role{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;font-weight:600}
#pg #job{color:var(--mute);margin-top:6px;font-size:13px}
#pg #label{font-weight:600;font-size:16px}#pg #when{color:var(--mute);min-height:40px}
#pg .row{display:flex;flex-wrap:wrap;gap:6px}
#pg button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;transition:.15s}
#pg button:hover{border-color:var(--brand)}#pg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#pg .crew{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
@media(max-width:1100px){#pg .crew{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}}
#pg .crew button{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 4px 8px;border-radius:14px;line-height:1.25}
#pg .crew button svg{width:64px;height:64px;display:block}
#pg .crew button b{font-size:13px}#pg .crew button span{font-size:11px;color:var(--mute)}
#pg .crew button.on{background:transparent;color:inherit;border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
#pg .sw{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid var(--line)}#pg .sw.on{outline:2px solid var(--brand);outline-offset:2px;background-clip:padding-box}
#pg .sep{width:1px;background:var(--line);margin:2px 4px}
#pg label{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}#pg input[type=color]{width:34px;height:28px;border:0;background:none;padding:0}
#pg select,#pg input[type=range]{accent-color:var(--brand)}#pg select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#pg code{background:rgba(127,127,127,.15);padding:1px 5px;border-radius:5px}
#pg small{color:var(--mute)}
#pg .guides{max-width:1180px;margin:0 auto;padding:0 20px 30px;display:grid;gap:10px}
#pg .guide summary{cursor:pointer;font-weight:600;font-size:15px}#pg .guide summary small{font-weight:400;margin-left:6px}#pg .guide[open] summary{margin-bottom:6px}
</style></head><body>
<div id="pg"><div class="wrap">
  <div><div class="card stage">
    <h1 id="name">Aegi</h1><div id="role"></div><div id="job"></div>
    <div id="mascot"></div>
    <div id="label"></div><div id="when"></div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button id="flow" class="on">▶ Run flow</button><button id="tour">▶ Crew hand-off</button><button id="bgbtn">Dark / light page</button>
    </div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <label><input type="checkbox" id="follow"> eyes follow cursor</label>
      <label><input type="checkbox" id="withsound" checked> play sounds</label>
    </div>
  </div></div>
  <div class="card">
    <h2>Mascots — one per job</h2><div class="crew" id="crew"></div>
    <h2 id="sigh">Signature moves</h2><div class="row" id="sig"></div>
    <h2>States (every mascot has these)</h2><div class="row" id="states"></div>
    <h2>Colours</h2><div class="row" id="themes"></div>
    <h2>Custom colours</h2>
    <div class="row"><label>body <input type="color" id="c_body" value="#BA5B45"></label><label>body 2 (gradient) <input type="color" id="c_body2" value="#BA5B45"></label>
      <label>eyes <input type="color" id="c_eye" value="#FBF8F4"></label><label>accent <input type="color" id="c_acc" value="#1F2224"></label><button id="dl">Download this SVG</button></div>
    <h2>Size</h2><input type="range" id="size" min="48" max="300" value="240">
    <h2>Sounds</h2>
    <div class="row" style="margin-bottom:8px"><label>pack <select id="pack"></select></label><label>volume <input type="range" id="vol" min="0" max="1" step="0.05" value="0.6"></label></div>
    <div class="row" id="sounds"></div>
    <h2>App events (mascot + sound together)</h2><div class="row" id="events"></div>
    <p><small>Everything on this page is generated live by <code>src/mascot.js</code> and <code>src/sounds.js</code> — no image or audio files are loaded.</small></p>
  </div>
</div><div class="guides"><!--GUIDES--></div></div>
<script>/*__LIB__*/</script>
<script>
const $ = id => document.getElementById(id);
const aegi = createAegis('#mascot', { size: 240, character: 'aegi', theme: 'color' });
const m = aegi.mascot, sfx = aegi.sounds;
let who = 'aegi', theme = 'color', timers = [];
const stop = () => { timers.forEach(clearTimeout); timers = []; };
const btns = (host, names, label, click, cls = '') => names.map(n => { const b = document.createElement('button'); b.className = cls; b.innerHTML = label(n); b.dataset.n = n; b.onclick = () => click(n, b); $(host).appendChild(b); return b; });
const mark = (host, n) => [...$(host).children].forEach(b => b.classList.toggle('on', b.dataset.n === n));
const snd = n => { if (n && $('withsound').checked) sfx.play(n); };
function show(state) { mark('states', state); mark('sig', state); $('label').textContent = STATES[state].label; $('when').textContent = STATES[state].when; }
function setState(s) { m.setState(s); show(s); snd(STATE_SOUNDS[s]); }
const SIG_SOUND = Object.fromEntries(Object.values(EVENTS).filter(e => e.character).map(e => [e.state, e.sound]));
const paint = c => Array.isArray(c) ? `linear-gradient(135deg,${c.join(',')})` : c;
const flat = c => Array.isArray(c) ? c[0] : c;
function swatches() {
  $('themes').innerHTML = '';
  btns('themes', VARIANTS, () => '', n => setTheme(n), 'sw').forEach(b => { const T = characterTheme(who, b.dataset.n); b.style.background = T.body; if (T.stroke) b.style.borderColor = T.stroke; b.title = { color: CHARACTERS[who].name + ' colour', dark: 'Dark', light: 'Light' }[b.dataset.n]; });
  const s = document.createElement('span'); s.className = 'sep'; $('themes').appendChild(s);
  btns('themes', THEME_NAMES.filter(t => !['terracotta', 'dark', 'light'].includes(t)), () => '', n => setTheme(n), 'sw').forEach(b => { b.style.background = paint(THEMES[b.dataset.n].body); b.title = THEMES[b.dataset.n].label; });
  mark('themes', typeof theme === 'string' ? theme : '');
}
function setTheme(n) { theme = n; m.setTheme(n); mark('themes', n); $('pg').classList.toggle('dk', ['dark', 'snow', 'neon', 'ocean'].includes(n)); pickers(); }
function pickers() { const T = resolveTheme(theme, who); $('c_body').value = flat(T.body); $('c_body2').value = Array.isArray(T.body) ? T.body[T.body.length - 1] : T.body; $('c_eye').value = flat(T.eye); $('c_acc').value = T.accent; }
function setWho(c, state) {
  who = c; const C = CHARACTERS[c]; if (typeof theme !== 'string') theme = 'color';
  m.setCharacter(c, { theme, state }); mark('crew', c);
  $('name').textContent = C.name; $('role').textContent = C.role; $('job').textContent = C.job + ' · ' + C.mood;
  $('pg').style.setProperty('--brand', C.palette.body === '#F2A72E' ? '#C97A0E' : C.palette.body);
  $('sig').innerHTML = ''; const sg = STATE_NAMES.filter(s => STATES[s].for === c);
  btns('sig', sg, n => STATES[n].label, n => { stop(); m.setState(n); show(n); snd(SIG_SOUND[n]); });
  $('sigh').style.display = $('sig').style.display = sg.length ? '' : 'none'; $('sigh').textContent = `Signature moves — only ${C.name} does these`;
  swatches(); pickers(); show(m.state);
}
btns('crew', CHARACTER_NAMES, c => renderSVG({ character: c, animated: false, shadow: false }).replace(/id="a/g, `id="c${c}`).replace(/url\(#a/g, `url(#c${c}`) + `<b>${CHARACTERS[c].name}</b><span>${CHARACTERS[c].role}</span>`, c => { stop(); setWho(c); snd('tap'); });
btns('states', COMMON_STATES, n => STATES[n].label, n => { stop(); setState(n); });
m.o.onStateEnd = () => setTimeout(() => show(m.state), 0);
const custom = () => { const a = $('c_body').value, b = $('c_body2').value; theme = { body: a === b ? a : [a, b], eye: $('c_eye').value, accent: $('c_acc').value }; m.setTheme(theme); mark('themes', ''); };
['c_body', 'c_body2', 'c_eye', 'c_acc'].forEach(id => $(id).oninput = custom);
$('size').oninput = e => m.setSize(+e.target.value);
$('follow').onchange = e => m.follow(e.target.checked);
$('bgbtn').onclick = () => $('pg').classList.toggle('dk');
$('dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([renderSVG({ character: who, state: m.state, theme })], { type: 'image/svg+xml' })); a.download = `${CHARACTERS[who].name.toLowerCase()}-${m.state}.svg`; a.click(); };
Object.keys(PACKS).forEach(p => $('pack').add(new Option(PACKS[p].label, p)));
$('pack').onchange = e => sfx.setPack(e.target.value); $('vol').oninput = e => sfx.setVolume(+e.target.value);
let loopOn = false;
btns('sounds', SOUND_NAMES, n => '♪ ' + SOUNDS[n].label, (n, b) => { if (SOUNDS[n].loop) { loopOn = !loopOn; loopOn ? sfx.startLoop(n) : sfx.stopLoop(n); b.classList.toggle('on', loopOn); } else sfx.play(n); }).forEach(b => b.title = SOUNDS[b.dataset.n].when);
const fire = n => { const e = EVENTS[n]; if (e.character && e.character !== who) setWho(e.character, e.state); if (e.state) { m.setState(e.state); show(e.state); } snd(e.sound); };
btns('events', Object.keys(EVENTS), n => n, n => { stop(); fire(n); });
const run = seq => { stop(); seq.forEach(([ev, at]) => timers.push(setTimeout(() => fire(ev), at))); };
const FLOWS = {
  aegi: [['mic:start', 0], ['mic:stop', 2600], ['prompt:send', 3300], ['agent:searching', 5200], ['agent:working', 8000], ['agent:reply', 10400], ['agent:done', 13200]],
  mail: [['mail:new', 0], ['mail:read', 2600], ['agent:thinking', 5800], ['mail:send', 8200], ['agent:done', 10400]],
  social: [['social:message', 0], ['social:typing', 2800], ['prompt:send', 6200], ['social:react', 8300], ['agent:done', 10500]],
  files: [['agent:searching', 0], ['files:found', 3000], ['files:organize', 5400], ['files:upload', 9000], ['agent:done', 11000]],
  memory: [['mic:start', 0], ['memory:save', 2600], ['memory:link', 5200], ['memory:recall', 8400], ['agent:reply', 11200], ['agent:done', 14000]],
  harness: [['harness:run', 0], ['harness:build', 3400], ['harness:test', 7000], ['agent:done', 10000]],
  security: [['security:scan', 0], ['security:alert', 4000], ['user:pause', 6600], ['security:scan', 9000], ['security:locked', 12000]],
};
$('flow').onclick = () => run(FLOWS[who]);
$('tour').onclick = () => run([['crew:lead', 0], ['mic:start', 2400], ['agent:thinking', 4600], ['mail:new', 6600], ['mail:read', 9000], ['social:message', 11600], ['social:typing', 14200], ['files:found', 16800], ['files:upload', 19200],
  ['memory:save', 21400], ['memory:recall', 24000], ['harness:run', 26800], ['harness:test', 29400], ['security:scan', 32400], ['security:locked', 35000], ['crew:lead', 37600], ['agent:done', 40200]]);
setWho('aegi'); show('idle');
window.__pg = m; window.__who = setWho;
</script></body></html>
